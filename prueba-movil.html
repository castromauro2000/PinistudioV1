<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Prueba móvil</title>
  <style>
    body { margin: 0; background: #111; font-family: system-ui, sans-serif; padding: 16px; }
    .celus { display: flex; gap: 16px; flex-wrap: wrap; }
    figure { margin: 0; }
    iframe { border: 0; border-radius: 18px; background: #0e1117; box-shadow: 0 8px 30px rgba(0,0,0,.6); }
    figcaption { color: #888; font-size: 12px; margin-top: 6px; text-align: center; }
  </style>
</head>
<body>
  <div class="celus">
    <figure>
      <iframe src="index.html" width="390" height="844"></iframe>
      <figcaption>iPhone 14 (390 x 844)</figcaption>
    </figure>
    <figure>
      <iframe src="index.html" width="360" height="640"></iframe>
      <figcaption>Android chico (360 x 640)</figcaption>
    </figure>
  </div>
</body>
</html>
